<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Odd or Even Checker</title>

    <link rel="stylesheet" href="webyss_b.css">
</head>

<body>

    <div class="calculator">

        <h1>ODD OR EVEN</h1>

        <div class="languages">
            <span>HTML</span>
            <span>•</span>
            <span>CSS</span>
            <span>•</span>
            <span>JAVASCRIPT</span>
        </div>

        <p class="subtitle">
            Enter a number to determine if it is ODD or EVEN
        </p>

        <div class="input-area">

            <div class="input-group">
                <label>ENTER NUMBER</label>
                <input type="number" id="number" placeholder="Enter a number">
            </div>

        </div>

        <button onclick="checkNumber()">
            CHECK NUMBER ♡
        </button>

        <div class="result-box">

            <div class="result-title">
                <span>RESULT</span>
                <span>✦</span>
            </div>

            <p id="result">
                Your result will appear here.
            </p>

        </div>

        <div class="footer">
            QUEZON CITY UNIVERSITY • WS101 • COLLEGE OF COMPUTER STUDIES
        </div>

    </div>

    <script src="websys_b.js"></script>

</body>
</html>
